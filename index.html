<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Välj tid — SLEF</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #9B1C3A; --red-light: #C0395A; --red-pale: #F7EEF1; --red-border: #E8C8D2;
  --cream: #FAF8F5; --text: #1A1A1A; --muted: #6B6560; --light: #9E9890;
  --border: #E2DDD8; --border-s: #C8C0B8; --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}
body { font-family:'Source Sans 3',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; font-size:16px; line-height:1.6; }

header { background:var(--white); border-bottom:1px solid var(--border); padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:68px; position:sticky; top:0; z-index:100; }
.logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
.logo-mark { width:44px; height:44px; object-fit:contain; }
.logo-text { font-family:'Lora',serif; font-size:15px; font-weight:600; color:var(--red); line-height:1.2; }
.logo-sub { font-size:11px; color:var(--muted); letter-spacing:.04em; }
.header-badge { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:4px 14px; }

.hero { background:var(--red); padding:3.5rem 2rem 3rem; text-align:center; }
.hero-eyebrow { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:.5rem; }
.hero h1 { font-family:'Lora',serif; font-size:clamp(24px,5vw,36px); font-weight:400; color:#fff; margin-bottom:.75rem; }
.hero p { font-size:15px; color:rgba(255,255,255,.72); max-width:480px; margin:0 auto; }

main { max-width:780px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
.card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; box-shadow:var(--shadow); }
.card-label { display:block; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem; }

.name-row input { width:100%; font-family:'Source Sans 3',sans-serif; font-size:15px; padding:10px 14px; border:1px solid var(--border-s); border-radius:8px; background:var(--cream); color:var(--text); outline:none; transition:border-color .15s,box-shadow .15s; }
.name-row input:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(155,28,58,.08); }
.name-row input::placeholder { color:var(--light); }
.name-row input:disabled { opacity:.5; }

.edit-banner { background:var(--red-pale); border:1px solid var(--red-border); border-radius:10px; padding:12px 16px; margin-bottom:1.5rem; display:none; align-items:center; justify-content:space-between; gap:12px; }
.edit-banner.visible { display:flex; }
.edit-banner-text { font-size:13px; color:var(--red); font-weight:500; }
.edit-cancel { font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; background:none; border:none; font-family:inherit; }
.edit-cancel:hover { color:var(--red); }

.cal-card { background:var(--white); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:1.5rem; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:var(--red-pale); }
.cal-month { font-family:'Lora',serif; font-size:18px; font-weight:600; color:var(--red); }
.nav-btn { background:none; border:1px solid var(--red-border); border-radius:8px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--red); font-size:18px; transition:background .12s,transform .08s; font-family:inherit; line-height:1; }
.nav-btn:hover { background:var(--red-border); transform:scale(1.05); }
.nav-btn:active { transform:scale(0.97); }
.nav-btn:disabled { opacity:.3; pointer-events:none; }
.cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border); background:#FDFCFB; }
.cal-weekday { text-align:center; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:10px 0; }
.cal-days { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; border-right:1px solid var(--border); border-bottom:1px solid var(--border); transition:background .1s; position:relative; padding:4px; min-height:52px; }
.cal-day:nth-child(7n) { border-right:none; }
.cal-day.empty { cursor:default; background:#FDFCFB; }
.cal-day.past { cursor:default; opacity:.3; pointer-events:none; }
.cal-day:not(.empty):not(.past):hover { background:var(--red-pale); }
.cal-day.is-selected-day { background:var(--red) !important; }
.cal-day.is-selected-day .day-num { color:#fff; font-weight:600; }
.cal-day.user-has-times { background:rgba(155,28,58,.09); }
.cal-day.user-has-times .day-num { color:var(--red); font-weight:600; }
.cal-day.has-others { background:rgba(155,28,58,.05); }
.day-num { font-size:14px; font-weight:500; color:var(--text); line-height:1; margin-bottom:3px; }
.cal-day.today .day-num { color:var(--red); font-weight:700; }
.cal-day.today::before { content:''; position:absolute; top:5px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--red); }
.vote-dots { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:32px; }
.vote-dots span { width:5px; height:5px; border-radius:50%; background:var(--red-border); display:block; }
.vote-dots span.confirmed { background:var(--red); }

.time-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.5rem; box-shadow:var(--shadow); display:none; animation:slideIn .18s ease; }
@keyframes slideIn { from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)} }
.time-card.visible { display:block; }
.time-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:8px; }
.time-card-title { font-family:'Lora',serif; font-size:16px; color:var(--red); }
.time-actions { display:flex; gap:8px; }
.time-action-btn { font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; background:none; border:none; font-family:inherit; }
.time-action-btn:hover { color:var(--red); }
.time-slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
.time-slot { padding:9px 6px; border:1px solid var(--border-s); border-radius:8px; text-align:center; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted); background:var(--cream); transition:all .12s; user-select:none; }
.time-slot:hover { border-color:var(--red-light); color:var(--red); background:var(--red-pale); }
.time-slot.active { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
.t-votes { display:block; font-size:10px; font-weight:400; margin-top:2px; color:var(--red-light); }
.time-slot.active .t-votes { color:rgba(255,255,255,.65); }

.sel-summary { font-size:13px; color:var(--muted); margin-bottom:1rem; min-height:20px; }
.sel-count { display:inline-block; background:var(--red-pale); border:1px solid var(--red-border); color:var(--red); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; margin-left:4px; }
.submit-btn { width:100%; padding:14px; background:var(--red); color:#fff; border:none; border-radius:10px; font-family:'Source Sans 3',sans-serif; font-size:15px; font-weight:600; cursor:pointer; letter-spacing:.02em; transition:background .15s,transform .08s; margin-bottom:1.5rem; }
.submit-btn:hover { background:var(--red-light); }
.submit-btn:active { transform:scale(0.99); }
.submit-btn:disabled { opacity:.6; cursor:default; }
.submit-btn.edit-mode { background:#7A1530; }
.submit-btn.edit-mode:hover { background:var(--red); }

.divider { display:flex; align-items:center; gap:12px; margin:1.75rem 0; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
.divider span { font-size:12px; color:var(--light); letter-spacing:.06em; text-transform:uppercase; }

.results-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:1.5rem; box-shadow:var(--shadow); }
.results-title { font-family:'Lora',serif; font-size:17px; color:var(--text); margin-bottom:1rem; }
.respondents { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1.25rem; }
.r-chip { position:relative; display:inline-flex; align-items:center; gap:7px; font-size:13px; border-radius:999px; border:1px solid var(--border); background:var(--cream); color:var(--muted); overflow:hidden; transition:border-color .15s; }
.r-chip-inner { display:flex; align-items:center; gap:7px; padding:5px 14px 5px 10px; transition:opacity .15s; white-space:nowrap; }
.r-dot { width:7px; height:7px; border-radius:50%; background:var(--red); flex-shrink:0; }
.r-edit-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--red); color:#fff; font-size:12px; font-weight:600; cursor:pointer; opacity:0; transition:opacity .18s; border:none; font-family:inherit; border-radius:999px; white-space:nowrap; padding:0 14px; }
.r-chip:hover { border-color:var(--red); }
.r-chip:hover .r-chip-inner { opacity:0; }
.r-chip:hover .r-edit-overlay { opacity:1; }

.best-times { border-top:1px solid var(--border); padding-top:1rem; }
.best-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:.75rem; }
.best-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:8px; background:var(--red-pale); border:1px solid var(--red-border); margin-bottom:6px; font-size:14px; gap:12px; }
.bi-date { font-weight:600; color:var(--text); }
.bi-who { font-size:11px; color:var(--red-light); margin-top:1px; }
.bi-count { font-size:12px; background:var(--red); color:#fff; border-radius:999px; padding:3px 12px; font-weight:600; white-space:nowrap; flex-shrink:0; }
.empty-results { font-size:14px; color:var(--light); text-align:center; padding:1.5rem 0; font-style:italic; }

/* Loading state */
.loading-bar { height:3px; background:var(--red-pale); border-radius:2px; overflow:hidden; margin-bottom:1.5rem; display:none; }
.loading-bar.visible { display:block; }
.loading-bar::after { content:''; display:block; height:100%; width:40%; background:var(--red); border-radius:2px; animation:slide 1s ease-in-out infinite; }
@keyframes slide { 0%{transform:translateX(-100%)}100%{transform:translateX(350%)} }

.status-msg { font-size:13px; color:var(--muted); text-align:center; padding:.75rem; }
.status-msg.error { color:var(--red); }

.toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:#fff; padding:10px 22px; border-radius:999px; font-size:14px; font-weight:500; transition:transform .3s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; z-index:999; pointer-events:none; }
.toast.show { transform:translateX(-50%) translateY(0); }

@media(max-width:520px) {
  header { padding:0 1rem; }
  .hero { padding:2.5rem 1rem 2rem; }
  .logo-sub { display:none; }
  .cal-day { min-height:40px; }
  .day-num { font-size:12px; }
  .header-badge { display:none; }
}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <!-- Ladda upp logo.png i samma mapp som index.html på GitHub -->
    <img class="logo-mark" src="logo.png" alt="SLEF" onerror="this.style.display='none'" />
    <div>
      <div class="logo-text">SLEF</div>
      <div class="logo-sub">Svenska Lutherska Evangeliföreningen</div>
    </div>
  </a>
  <div class="header-badge">Tidsbokningsverktyg</div>
</header>

<div class="hero">
  <p class="hero-eyebrow">Boka möte</p>
  <h1>Välj när du kan träffas</h1>
  <p>Markera dagar och tider som passar — vi hittar bästa gemensamma tid för alla.</p>
</div>

<main>

  <div class="loading-bar" id="loading-bar"></div>

  <div class="edit-banner" id="edit-banner">
    <span class="edit-banner-text" id="edit-banner-text"></span>
    <button class="edit-cancel" onclick="cancelEdit()">Avbryt</button>
  </div>

  <div class="card">
    <label class="card-label" for="name-input">Ditt namn</label>
    <div class="name-row">
      <input id="name-input" type="text" placeholder="Förnamn Efternamn..." maxlength="40" autocomplete="off" />
    </div>
  </div>

  <div class="cal-card">
    <div class="cal-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevMonth()">&#8249;</button>
      <span class="cal-month" id="month-label"></span>
      <button class="nav-btn" onclick="nextMonth()">&#8250;</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">Mån</div><div class="cal-weekday">Tis</div>
      <div class="cal-weekday">Ons</div><div class="cal-weekday">Tor</div>
      <div class="cal-weekday">Fre</div><div class="cal-weekday">Lör</div>
      <div class="cal-weekday">Sön</div>
    </div>
    <div class="cal-days" id="cal-days"></div>
  </div>

  <div class="time-card" id="time-card">
    <div class="time-card-header">
      <span class="time-card-title" id="time-card-title">Välj tider</span>
      <div class="time-actions">
        <button class="time-action-btn" onclick="selectAllTimes()">Välj alla</button>
        <button class="time-action-btn" onclick="clearDayTimes()">Rensa</button>
      </div>
    </div>
    <div class="time-slots" id="time-slots"></div>
  </div>

  <div class="sel-summary" id="sel-summary"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitVote()">Skicka in mina tider →</button>

  <div class="divider"><span>Samlade svar</span></div>

  <div class="results-card">
    <div class="results-title" id="results-title">Vem har svarat</div>
    <div class="respondents" id="respondents-list">
      <div class="empty-results">Laddar svar...</div>
    </div>
    <div class="best-times" id="best-times" style="display:none;">
      <div class="best-label">Populäraste tiderna</div>
      <div id="best-list"></div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BYTA URL: Klistra in din Apps Script webb-URL här
// (du får den i steg 3 nedan)
const SCRIPT_URL = https://script.google.com/macros/s/AKfycbxLvbZulvUJec4DwUGHJchB-knwTIJ078ByrFwssOToCfM5O_GNrkJOIjjDAu5VBw3w/exec
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const MONTHS=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const TIMES=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
const DAYS_SV=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];

const today=new Date(); today.setHours(0,0,0,0);
let viewYear=today.getFullYear(), viewMonth=today.getMonth();
let selectedDay=null;
let userSelection={};
let votes={};
let respondents=[];
let editingName=null;

function dk(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function vk(date,time){ return `${date}|${time}`; }
function fmtDate(ds){
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return `${DAYS_SV[dt.getDay()].charAt(0).toUpperCase()+DAYS_SV[dt.getDay()].slice(1)} ${d} ${MONTHS[m-1].toLowerCase()}`;
}

// ── LOADING ───────────────────────────────────────
function setLoading(on){
  document.getElementById('loading-bar').classList.toggle('visible',on);
  document.getElementById('submit-btn').disabled=on;
}

// ── GOOGLE SHEETS: HÄMTA DATA ─────────────────────
async function fetchData(){
  if(SCRIPT_URL==="DIN_APPS_SCRIPT_URL_HÄR"){
    document.getElementById('respondents-list').innerHTML=
      '<div class="status-msg error">Lägg in din Apps Script URL i koden för att aktivera databasen.</div>';
    return;
  }
  try {
    setLoading(true);
    const res=await fetch(SCRIPT_URL);
    const data=await res.json();
    if(data.ok){
      votes=data.votes||{};
      respondents=data.respondents||[];
      renderCalendar();
      renderResults();
    }
  } catch(err){
    document.getElementById('respondents-list').innerHTML=
      '<div class="status-msg error">Kunde inte ladda svar. Kontrollera URL:en.</div>';
  } finally { setLoading(false); }
}

// ── GOOGLE SHEETS: SPARA DATA ─────────────────────
async function saveToSheet(name, days){
  if(SCRIPT_URL==="DIN_APPS_SCRIPT_URL_HÄR") return true; // lokalt läge
  const res=await fetch(SCRIPT_URL,{
    method:'POST',
    body: JSON.stringify({name, days}),
  });
  const data=await res.json();
  return data.ok;
}

// ── NAV ───────────────────────────────────────────
function prevMonth(){
  if(viewMonth===0){viewMonth=11;viewYear--;}else viewMonth--;
  renderCalendar();
}
function nextMonth(){
  if(viewMonth===11){viewMonth=0;viewYear++;}else viewMonth++;
  renderCalendar();
}

// ── CALENDAR ──────────────────────────────────────
function renderCalendar(){
  document.getElementById('month-label').textContent=`${MONTHS[viewMonth]} ${viewYear}`;
  const firstDow=(()=>{ let d=new Date(viewYear,viewMonth,1).getDay(); return d===0?6:d-1; })();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  const container=document.getElementById('cal-days');
  container.innerHTML='';

  for(let i=0;i<firstDow;i++){
    const e=document.createElement('div'); e.className='cal-day empty'; container.appendChild(e);
  }
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(viewYear,viewMonth,d); dt.setHours(0,0,0,0);
    const key=dk(viewYear,viewMonth,d);
    const isPast=dt<today, isToday=dt.getTime()===today.getTime();
    const isSelDay=key===selectedDay;
    const userHasTimes=userSelection[key]&&userSelection[key].size>0;
    const allVoters=new Set();
    TIMES.forEach(t=>{ (votes[vk(key,t)]||[]).forEach(n=>allVoters.add(n)); });

    const el=document.createElement('div');
    let cls='cal-day';
    if(isPast) cls+=' past';
    if(isToday) cls+=' today';
    if(isSelDay) cls+=' is-selected-day';
    else if(userHasTimes) cls+=' user-has-times';
    else if(allVoters.size>0) cls+=' has-others';
    el.className=cls;

    const num=document.createElement('div'); num.className='day-num'; num.textContent=d;
    el.appendChild(num);

    if(allVoters.size>0){
      const dots=document.createElement('div'); dots.className='vote-dots';
      let i=0; allVoters.forEach(n=>{ if(i++>=4)return; const dot=document.createElement('span'); dot.classList.add('confirmed'); dots.appendChild(dot); });
      el.appendChild(dots);
    }

    if(!isPast) el.onclick=()=>selectDay(key);
    container.appendChild(el);
  }
  document.getElementById('prev-btn').disabled=
    viewYear===today.getFullYear()&&viewMonth===today.getMonth();
}

function selectDay(key){ selectedDay=key; renderCalendar(); showTimePicker(key); }

// ── TIME PICKER ───────────────────────────────────
function showTimePicker(key){
  const card=document.getElementById('time-card');
  card.classList.add('visible');
  document.getElementById('time-card-title').textContent=fmtDate(key);
  if(!userSelection[key]) userSelection[key]=new Set();
  renderTimeSlots(key);
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
  updateSummary();
}

function renderTimeSlots(key){
  const container=document.getElementById('time-slots');
  container.innerHTML='';
  TIMES.forEach(time=>{
    const k=vk(key,time);
    const others=(votes[k]||[]).filter(n=>n!==editingName);
    const isActive=userSelection[key].has(time);
    const el=document.createElement('div');
    el.className='time-slot'+(isActive?' active':'');
    el.innerHTML=`${time}<span class="t-votes">${others.length>0?others.length+' kan':''}</span>`;
    el.onclick=()=>toggleTime(key,time,el);
    container.appendChild(el);
  });
}

function toggleTime(key,time,el){
  if(!userSelection[key]) userSelection[key]=new Set();
  if(userSelection[key].has(time)){ userSelection[key].delete(time); el.classList.remove('active'); }
  else { userSelection[key].add(time); el.classList.add('active'); }
  renderCalendar(); updateSummary();
}

function clearDayTimes(){
  if(selectedDay&&userSelection[selectedDay]){ userSelection[selectedDay].clear(); renderTimeSlots(selectedDay); renderCalendar(); updateSummary(); }
}
function selectAllTimes(){
  if(!selectedDay) return;
  if(!userSelection[selectedDay]) userSelection[selectedDay]=new Set();
  TIMES.forEach(t=>userSelection[selectedDay].add(t));
  renderTimeSlots(selectedDay); renderCalendar(); updateSummary();
}

function updateSummary(){
  let slots=0,days=0;
  Object.entries(userSelection).forEach(([k,s])=>{ if(s.size>0){days++;slots+=s.size;} });
  const el=document.getElementById('sel-summary');
  if(slots===0){ el.innerHTML='Välj dagar i kalendern och markera tider som passar dig.'; return; }
  el.innerHTML=`Du har valt <span class="sel-count">${slots} tid${slots!==1?'er':''}</span> på <span class="sel-count">${days} dag${days!==1?'ar':''}</span>.`;
}

// ── EDIT MODE ─────────────────────────────────────
function startEdit(name){
  editingName=name;
  const person=respondents.find(r=>r.name===name);
  if(person){
    Object.entries(person.days).forEach(([ds,times])=>{
      times.forEach(t=>{ const k=vk(ds,t); if(votes[k]) votes[k]=votes[k].filter(n=>n!==name); });
    });
  }
  userSelection={};
  if(person){
    Object.entries(person.days).forEach(([ds,times])=>{ userSelection[ds]=new Set(times); });
  }
  document.getElementById('name-input').value=name;
  document.getElementById('name-input').disabled=true;
  document.getElementById('edit-banner').classList.add('visible');
  document.getElementById('edit-banner-text').textContent=`Du redigerar tider för ${name}`;
  const btn=document.getElementById('submit-btn');
  btn.textContent='Spara ändrade tider →'; btn.classList.add('edit-mode');
  selectedDay=null;
  document.getElementById('time-card').classList.remove('visible');
  renderCalendar(); updateSummary();
  window.scrollTo({top:0,behavior:'smooth'});
  showToast(`Redigerar ${name} — välj nya tider och spara`);
}

function cancelEdit(){
  if(editingName){
    const person=respondents.find(r=>r.name===editingName);
    if(person){
      Object.entries(person.days).forEach(([ds,times])=>{
        times.forEach(t=>{ const k=vk(ds,t); if(!votes[k]) votes[k]=[]; if(!votes[k].includes(editingName)) votes[k].push(editingName); });
      });
    }
  }
  resetForm();
}

function resetForm(){
  editingName=null; userSelection={}; selectedDay=null;
  document.getElementById('name-input').value='';
  document.getElementById('name-input').disabled=false;
  document.getElementById('edit-banner').classList.remove('visible');
  document.getElementById('time-card').classList.remove('visible');
  const btn=document.getElementById('submit-btn');
  btn.textContent='Skicka in mina tider →'; btn.classList.remove('edit-mode');
  renderCalendar(); updateSummary();
}

// ── SUBMIT ────────────────────────────────────────
async function submitVote(){
  const name=document.getElementById('name-input').value.trim();
  if(!name){ showToast('Skriv ditt namn först'); return; }
  let totalSlots=0; Object.values(userSelection).forEach(s=>totalSlots+=s.size);
  if(totalSlots===0){ showToast('Välj minst en tid i kalendern'); return; }

  const daysToSave={};
  Object.entries(userSelection).forEach(([ds,timeSet])=>{
    if(timeSet.size>0) daysToSave[ds]=[...timeSet];
  });

  setLoading(true);
  try {
    const ok=await saveToSheet(name, daysToSave);
    if(!ok){ showToast('Något gick fel — försök igen'); setLoading(false); return; }
  } catch(e){ showToast('Nätverksfel — försök igen'); setLoading(false); return; }

  // Update local state
  Object.entries(daysToSave).forEach(([ds,times])=>{
    times.forEach(time=>{ const k=vk(ds,time); if(!votes[k]) votes[k]=[]; if(!votes[k].includes(name)) votes[k].push(name); });
  });
  const personData={name,days:daysToSave};
  const idx=respondents.findIndex(r=>r.name===name);
  if(idx>=0) respondents[idx]=personData; else respondents.push(personData);

  const wasEditing=editingName;
  resetForm();
  renderResults();
  setLoading(false);
  showToast(wasEditing?`${name}s tider uppdaterade ✓`:`Tack ${name}! Dina tider är sparade ✓`);
}

// ── RESULTS ───────────────────────────────────────
function renderResults(){
  const list=document.getElementById('respondents-list');
  document.getElementById('results-title').textContent=
    respondents.length>0?`${respondents.length} person${respondents.length!==1?'er':''} har svarat`:'Vem har svarat';
  if(respondents.length===0){
    list.innerHTML='<div class="empty-results">Inga svar ännu — bli den första!</div>';
    document.getElementById('best-times').style.display='none'; return;
  }
  list.innerHTML=respondents.map(r=>`
    <div class="r-chip">
      <div class="r-chip-inner"><div class="r-dot"></div>${r.name}</div>
      <button class="r-edit-overlay" onclick="startEdit('${r.name}')">Redigera ${r.name}s tider</button>
    </div>`).join('');

  const counts={};
  Object.entries(votes).forEach(([k,names])=>{ if(names.length>0) counts[k]=names.length; });
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(sorted.length===0){ document.getElementById('best-times').style.display='none'; return; }
  document.getElementById('best-times').style.display='block';
  document.getElementById('best-list').innerHTML=sorted.map(([k,count])=>{
    const [ds,time]=k.split('|');
    const plural=count===1?'person':'personer';
    return `<div class="best-item">
      <div><div class="bi-date">${fmtDate(ds)} kl. ${time}</div>
      <div class="bi-who">${votes[k].join(', ')}</div></div>
      <span class="bi-count">${count} ${plural}</span>
    </div>`;
  }).join('');
}

// ── TOAST ─────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ── INIT ──────────────────────────────────────────
renderCalendar(); updateSummary(); fetchData();
</script>
